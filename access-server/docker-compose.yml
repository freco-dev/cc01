services:
  postgres:
    image: postgres:16-alpine
    container_name: accessserver-postgres
    environment:
      POSTGRES_DB: access_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access_server"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: accessserver-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AccessServer.Api/Dockerfile
    container_name: accessserver-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=postgres;Port=5432;Database=access_server;Username=postgres;Password=root
      Redis__Configuration: redis:6379
      Redis__InstanceName: accessserver:
      Jwt__Issuer: AccessServer.Api
      Jwt__Audience: AccessServer.Clients
      Jwt__SigningKey: REPLACE_WITH_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS
      Jwt__AccessTokenMinutes: 60
      Jwt__RefreshTokenDays: 30
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy