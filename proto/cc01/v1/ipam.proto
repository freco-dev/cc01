syntax = "proto3";

package cc01.v1;

option go_package = "github.com/freco-dev/cc01/proto/gen/cc01/v1;cc01v1";
option csharp_namespace = "Cc01.V1";

import "google/protobuf/timestamp.proto";

// IPAM ning Raft jurnaliga yoziladigan buyruqlari
// (ARCHITECTURE.md §3.1.6, ADR-006).
//
// Nega protobuf: Raft jurnali DOIMIY saqlanadi va klaster yangilanganda
// eski yozuvlar qayta o'qiladi. Ya'ni bu format orqaga moslikni
// saqlashi shart — buf lint va `buf breaking` uni boshqa shartnomalar
// bilan bir xil qattiqlikda qo'riqlaydi.

// LeaseCommand — holatni o'zgartiradigan bitta amal.
//
// ⚠️ Buyruq TO'LIQ ANIQLANGAN bo'lishi shart. Tasodifiy tanlov va
// joriy vaqt LIDER tomonida hal qilinadi va shu yerga yoziladi;
// replikalar faqat qo'llaydi. Aks holda har bir replika boshqa
// natijaga kelib, holat ajralib ketardi.
message LeaseCommand {
  // Now — liderning buyruqni taklif qilgan payti. Muddatlar shundan
  // hisoblanadi.
  google.protobuf.Timestamp now = 1;

  oneof command {
    AllocateLease     allocate = 2;
    RenewLease        renew    = 3;
    ReleaseLease      release  = 4;
    SweepLeases       sweep    = 5;
    BindNodeIdentity  bind     = 6;

    // Registry buyruqlari. Nomi "Lease" bo'lsa-da, bu xabar
    // endi CP ning UMUMIY buyruq konverti: bitta Raft jurnali
    // bor va undagi har bir yozuv shu turdan o'qiladi. Xabarni
    // qayta nomlash simdagi formatni o'zgartirmaydi, lekin
    // generatsiya qilingan nomlarni butun kod bo'ylab
    // almashtirardi — foydasi yo'q shovqin.
    RegisterNode      register_node   = 7;
    HeartbeatNode     heartbeat_node  = 8;
    UnregisterNode    unregister_node = 9;
    ExpireNodes       expire_nodes    = 10;
  }
}

// ── Registry buyruqlari ────────────────────────────────────────
//
// Node ro'yxati REPLIKATSIYA qilinishi shart. U faqat liderning
// xotirasida qolsa, failover'dan keyin yangi liderning ro'yxati
// bo'sh bo'lardi va nodelar qayta ro'yxatdan o'tmaguncha
// NetworkMap to'liq bo'lmasdi — ya'ni mesh vaqtincha yemirilardi.

// RegisterNode nodeni ro'yxatga oladi yoki mavjudini yangilaydi.
message RegisterNode {
  bytes  public_key = 1;
  string tenant     = 2;
  string hostname   = 3;

  // Addresses — prefikslar matn ko'rinishida ("2a0e:1::5/128").
  repeated string addresses = 4;

  // Endpoints — underlay manzillari ("1.2.3.4:51820").
  repeated string endpoints = 5;

  repeated string tags       = 6;
  string          relay_home = 7;

  // TtlSeconds — buyruqqa yoziladi, konstantadan o'qilmaydi:
  // konstanta o'zgarsa eski jurnal boshqacha qo'llanib,
  // replikalar ajralib ketardi.
  uint64 ttl_seconds = 8;
}

// HeartbeatNode TTL ni uzaytiradi va endpointlarni yangilaydi.
message HeartbeatNode {
  string node_id = 1;

  // Endpoints — bo'sh ro'yxat va "berilmagan" ni ajratish uchun
  // alohida bayroq kerak: birinchisi "endpoint yo'q", ikkinchisi
  // "tegmang" degani.
  repeated string endpoints     = 2;
  bool            has_endpoints = 3;

  uint64 ttl_seconds = 4;
}

// UnregisterNode nodeni ro'yxatdan chiqaradi.
message UnregisterNode {
  string node_id = 1;
}

// ExpireNodes muddati o'tganlarni chiqaradi.
//
// Lider taklif qiladi: `now` buyruqda, ya'ni hamma replika AYNAN
// bir xil nodelarni chiqaradi.
message ExpireNodes {}

// AllocateLease — yangi ijara. Prefiks va ID lider tomonidan
// tanlangan.
message AllocateLease {
  string lease_id = 1;

  // Prefix — lider tanlagan prefiks, masalan "2a0e:1::5/128".
  string prefix = 2;

  // Kind — ijara turi (node /128, tenant /64, ...).
  uint32 kind = 3;

  string owner  = 4;
  string tenant = 5;

  // Parent — qaysi pool ichidan berilgan.
  string parent = 6;

  // ReclaimLeaseId — sticky taqsimlashda olib tashlanadigan
  // karantin yozuvi; bo'sh bo'lsa yo'q.
  string reclaim_lease_id = 7;

  // TtlSeconds — ijara muddati. Buyruqqa yoziladi, konstantadan
  // o'qilmaydi: konstanta o'zgarsa eski jurnal boshqacha qo'llanib,
  // replikalar ajralib ketardi.
  uint64 ttl_seconds = 8;
}

message RenewLease {
  string lease_id    = 1;
  uint64 ttl_seconds = 2;
}

message ReleaseLease {
  string lease_id = 1;
}

// SweepLeases — muddati o'tganlarni karantinga, karantini
// tugaganlarni butunlay o'chiradi.
message SweepLeases {}

// BindNodeIdentity nodeni uning TLS sertifikatiga bog'laydi.
//
// Bog'lanish REPLIKATSIYA qilinishi shart: u faqat liderning
// xotirasida qolsa, failover'dan keyin yo'qolib, hamma node qaytadan
// token bilan ro'yxatdan o'tishi kerak bo'lardi — ya'ni himoya
// birinchi nosozlikdayoq yo'qolardi.
message BindNodeIdentity {
  string node_id = 1;

  // CertPin — sertifikatning SPKI barmoq izi ("sha256/...").
  string cert_pin = 2;
}

// LeaseRecord — snapshot'ga yoziladigan bitta ijara.
//
// Buyruqlardan alohida tur: buyruq "nima qilinsin" ni, bu esa
// "hozir nima bor" ni tasvirlaydi. Ularni birlashtirish snapshot
// formatini buyruq formatining o'zgarishlariga bog'lab qo'yardi.
message LeaseRecord {
  string id     = 1;
  string prefix = 2;
  uint32 kind   = 3;
  uint32 state  = 4;
  string owner  = 5;
  string tenant = 6;
  string parent = 7;

  google.protobuf.Timestamp issued_at   = 8;
  google.protobuf.Timestamp expires_at  = 9;

  // ReleasedAt — karantinga tushgan vaqt; faqat karantin holatida
  // to'ldiriladi.
  google.protobuf.Timestamp released_at = 10;
}

// IdentityRecord — snapshot'ga yoziladigan bitta bog'lanish.
message IdentityRecord {
  string node_id  = 1;
  string cert_pin = 2;
}

// NodeRecord — snapshot'ga yoziladigan bitta node.
message NodeRecord {
  string node_id    = 1;
  bytes  public_key = 2;
  string tenant     = 3;
  string hostname   = 4;

  repeated string addresses  = 5;
  repeated string endpoints  = 6;
  repeated string tags       = 7;
  string          relay_home = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_seen  = 10;
  google.protobuf.Timestamp expires_at = 11;
}

// RegistryMeta — snapshot'dagi registry metama'lumoti.
//
// Hozircha faqat versiya, lekin alohida yozuv sifatida: kelajakda
// qo'shiladigan maydonlar node yozuvlarining formatiga tegmasligi
// kerak.
message RegistryMeta {
  uint64 version = 1;
}
