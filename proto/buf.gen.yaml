version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/freco-dev/cc01/core-server/gen
plugins:
  # ── Go (core-server, cli-client) ──────────────────────────────
  - remote: buf.build/protocolbuffers/go
    out: ../core-server/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../core-server/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # ── C# (access-server) ────────────────────────────────────────
  # C# tomonda kod generatsiyasi Grpc.Tools orqali csproj ichida bajariladi
  # (<Protobuf Include="..." />), shuning uchun bu yerda plugin yo'q.
  # Sabab: MSBuild generatsiyani build vaqtida qiladi, generate qilingan
  # kodni repoga commit qilish shart emas.
